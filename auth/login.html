<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вхід — Дніпровська філармонія</title>

  <style>
    :root {
      --blue: #1598d2;
      --blue-dark: #0875aa;
      --ink: #183042;
      --muted: #617584;
      --line: #d8e8f0;
      --soft: #eef8fc;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fff;
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(430px, 100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .mark {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--soft);
      color: var(--blue-dark);
      font-size: 28px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(32, 93, 119, .10);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .lead {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.45;
    }

    label {
      display: block;
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #c8dce6;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
      background: #fff;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21, 152, 210, .13);
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
    }

    button:hover { background: var(--blue-dark); }
    button:disabled { opacity: .6; cursor: wait; }

    .message {
      min-height: 22px;
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error { color: var(--danger); }
    .message.ok { color: #067647; }

    .security-note {
      margin-top: 18px;
      padding: 13px 14px;
      border-radius: 12px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <main class="shell">
    <div class="brand">
      <div class="mark">Ф</div>
      <div>
        <h1>Дніпровська філармонія</h1>
        <p>Вхід до робочого місця</p>
      </div>
    </div>

    <section class="card">
      <h2>Вхід</h2>
      <p class="lead">
        Використовуйте персональну облікову записку співробітника.
      </p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="password">Пароль</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="submitBtn" type="submit">
          Увійти
        </button>
      </form>

      <div id="message" class="message" aria-live="polite"></div>

      <div class="security-note">
        Після входу система відкриє тільки дозволений кабінет.
        Пароль не зберігається у файлах платформи.
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/app-config.js"></script>
  <script src="../shared/supabase-client.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const messageEl = document.getElementById("message");

    function setMessage(text, type = "") {
      messageEl.textContent = text || "";
      messageEl.className = `message ${type}`.trim();
    }

    function safeNextPath(value) {
      if (!value) return "";

      try {
        const url = new URL(value, location.origin);
        if (url.origin !== location.origin) return "";
        return `${url.pathname}${url.search}${url.hash}`;
      } catch (_) {
        return "";
      }
    }

    async function routeAfterLogin() {
      const params = new URLSearchParams(location.search);
      const requestedNext = safeNextPath(params.get("next"));

      const profile = await PhAuth.getAccessProfile({ refresh: true });

      if (requestedNext) {
        location.replace(requestedNext);
        return;
      }

      const route =
        profile?.default_workspace?.route ||
        PhAuth.config.PLATFORM_ADMIN_PATH;

      location.replace(route);
    }

    async function checkExistingSession() {
      try {
        const session = await PhAuth.getSession();
        if (session) await routeAfterLogin();
      } catch (error) {
        setMessage(
          error.message === "staff_access_denied"
            ? "Обліковий запис не має активного доступу до платформи."
            : error.message,
          "error"
        );
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      setMessage("");
      submitBtn.disabled = true;
      submitBtn.textContent = "Вхід…";

      try {
        const { error } = await PH_SUPABASE.auth.signInWithPassword({
          email: emailEl.value.trim(),
          password: passwordEl.value
        });

        if (error) throw error;

        setMessage("Вхід виконано.", "ok");
        await routeAfterLogin();

      } catch (error) {
        await PH_SUPABASE.auth.signOut();

        const text = String(error?.message || error);

        setMessage(
          text === "staff_access_denied"
            ? "Користувач існує, але доступ співробітника не призначено."
            : "Не вдалося увійти. Перевірте email і пароль.",
          "error"
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Увійти";
      }
    });

    checkExistingSession();
  </script>
</body>
</html>
